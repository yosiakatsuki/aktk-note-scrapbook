<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="options.css">
<title>note Scrapbook の設定</title>
</head>
<body>
<h1>note Scrapbook の設定</h1>

<section>
  <h2>保存先フォルダ</h2>
  <p class="description">
    記事はここで選んだフォルダの下に、記事タイトル名のフォルダを作って保存されます。
    一度選んでおけば、以降は保存ダイアログなしで書き込まれます。
  </p>
  <p class="current">現在の保存先: <strong id="current">未設定</strong></p>
  <button id="choose" type="button">保存先フォルダを選ぶ</button>
  <p id="status" class="status" role="status"></p>
</section>

<script src="options.js" type="module"></script>
</body>
</html>
