<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="popup.css">
<title>note Scrapbook</title>
</head>
<body>
<h1>note Scrapbook</h1>
<p id="target" class="target">読み込み中…</p>
<button id="save" type="button" disabled>この記事を保存</button>
<button id="grant" type="button" hidden>保存先へのアクセスを許可</button>
<p id="status" class="status" role="status"></p>
<p class="footer">
  保存先: <span id="destination">未設定</span>
  <a id="options" href="#">変更</a>
</p>
<script src="popup.js" type="module"></script>
</body>
</html>
